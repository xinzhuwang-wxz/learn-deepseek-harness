<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">一条结果怎样成为下一次请求的一部分</title><desc id="desc">两轮请求与messages增长。第一次请求只有用户消息，第二次已有调用声明和c1的工具结果，最终无调用时停止。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3866a6" /></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#23776b" /></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d;font-size:19px} .title{font-size:28px;font-weight:700} .label{font-size:22px;font-weight:700} .small{font-size:17px} .mono{font-family:ui-monospace,monospace;font-size:18px} .edge{fill:none;stroke:#3866a6;stroke-width:2.5;marker-end:url(#arrow)} .muted{fill:#53657e}</style>
<rect width="1120" height="650" rx="16" fill="#f7f9fc" />
<text x="36" y="48" class="title" font-family="sans-serif" fill="#172b4d" font-size="28" font-weight="700">一条结果怎样成为下一次请求的一部分</text>
<rect x="40" y="100" width="300" height="155" rx="12" fill="#fff" stroke="#bfd0e5" stroke-width="2" /><text x="60" y="134" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">请求前：M0</text><text x="60" y="167" font-family="sans-serif" fill="#172b4d" font-size="19">user: Double 21</text><text x="60" y="196" font-family="sans-serif" fill="#172b4d" font-size="19">第1次 request 长度 = 1</text><rect x="410" y="100" width="300" height="155" rx="12" fill="#fff" stroke="#bfd0e5" stroke-width="2" /><text x="430" y="134" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">第1轮模型响应</text><text x="430" y="167" font-family="sans-serif" fill="#172b4d" font-size="19">calls: c1 → double(21)</text><text x="430" y="196" font-family="sans-serif" fill="#172b4d" font-size="19">先追加 assistant 声明</text><rect x="780" y="100" width="300" height="155" rx="12" fill="#fff" stroke="#bfd0e5" stroke-width="2" /><text x="800" y="134" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">宿主执行工具</text><text x="800" y="167" font-family="sans-serif" fill="#172b4d" font-size="19">double(21) → 42</text><text x="800" y="196" font-family="sans-serif" fill="#172b4d" font-size="19">追加 tool: call_id=c1</text><path d="M340 177 H405" fill="none" stroke="#3866a6" stroke-width="2.5" /><polygon points="405.0,177.0 395.0,182.0 395.0,172.0" fill="#3866a6" /><path d="M710 177 H775" fill="none" stroke="#3866a6" stroke-width="2.5" /><polygon points="775.0,177.0 765.0,182.0 765.0,172.0" fill="#3866a6" /><path d="M930 255 V300 H190 V340" fill="none" stroke="#3866a6" stroke-width="2.5" /><polygon points="190.0,340.0 185.0,330.0 195.0,330.0" fill="#3866a6" /><text x="370" y="288" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">工具结果必须写回历史，再发下一次请求</text><rect x="40" y="345" width="300" height="210" rx="12" fill="#eaf2ff" stroke="#bfd0e5" stroke-width="2" /><text x="60" y="379" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">下一请求前：M1</text><text x="60" y="412" font-family="sans-serif" fill="#172b4d" font-size="19">user: Double 21</text><text x="60" y="441" font-family="sans-serif" fill="#172b4d" font-size="19">assistant: calls[c1]</text><text x="60" y="470" font-family="sans-serif" fill="#172b4d" font-size="19">tool: c1 → ok, 42</text><text x="60" y="499" font-family="sans-serif" fill="#172b4d" font-size="19">第2次 request 长度 = 3</text><rect x="410" y="345" width="300" height="210" rx="12" fill="#fff" stroke="#bfd0e5" stroke-width="2" /><text x="430" y="379" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">第2轮模型响应</text><text x="430" y="412" font-family="sans-serif" fill="#172b4d" font-size="19">记录传入的请求快照¹</text><text x="430" y="441" font-family="sans-serif" fill="#172b4d" font-size="19">返回 text: "42"</text><text x="430" y="470" font-family="sans-serif" fill="#172b4d" font-size="19">追加 assistant 文本</text><text x="430" y="499" font-family="sans-serif" fill="#172b4d" font-size="19">calls 为空 → 返回历史</text><rect x="780" y="345" width="300" height="210" rx="12" fill="#e8f5ef" stroke="#bfd0e5" stroke-width="2" /><text x="800" y="379" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">循环结束：M2</text><text x="800" y="412" font-family="sans-serif" fill="#172b4d" font-size="19">user → assistant(call)</text><text x="800" y="441" font-family="sans-serif" fill="#172b4d" font-size="19">→ tool → assistant(text)</text><text x="800" y="470" font-family="sans-serif" fill="#172b4d" font-size="19">最终历史长度 = 4</text><text x="800" y="499" font-family="sans-serif" fill="#172b4d" font-size="19">没有第3次模型请求</text><path d="M340 445 H405" fill="none" stroke="#3866a6" stroke-width="2.5" /><polygon points="405.0,445.0 395.0,450.0 395.0,440.0" fill="#3866a6" /><path d="M710 445 H775" fill="none" stroke="#3866a6" stroke-width="2.5" /><polygon points="775.0,445.0 765.0,450.0 765.0,440.0" fill="#3866a6" /><text x="40" y="605" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">¹ 教学 ScriptedModel 只记录请求，不根据请求推理；最终文本不是反馈成功的证据。</text>
</svg>