<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 310" role="img" aria-labelledby="title"><title id="title">工具体只在全部闸门通过后运行</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#315bad"/></marker></defs><rect width="1040" height="310" rx="16" fill="#f1f5fc"/><text x="30" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#142c54">工具体只在全部闸门通过后运行</text><rect x="30.0" y="66" width="224.0" height="85" rx="9" fill="white" stroke="#c4d2e9"/><text x="44.0" y="97" font-family="sans-serif" font-size="18" font-weight="700" fill="#244d95">策略</text><text x="44.0" y="126" font-family="sans-serif" font-size="14" fill="#4a5f7c">allow / ask / deny</text><path d="M257.0 108h20" stroke="#315bad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="282.0" y="66" width="224.0" height="85" rx="9" fill="white" stroke="#c4d2e9"/><text x="296.0" y="97" font-family="sans-serif" font-size="18" font-weight="700" fill="#244d95">审批</text><text x="296.0" y="126" font-family="sans-serif" font-size="14" fill="#4a5f7c">缺失通道 → deny</text><path d="M509.0 108h20" stroke="#315bad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="534.0" y="66" width="224.0" height="85" rx="9" fill="white" stroke="#c4d2e9"/><text x="548.0" y="97" font-family="sans-serif" font-size="18" font-weight="700" fill="#244d95">单调守卫</text><text x="548.0" y="126" font-family="sans-serif" font-size="14" fill="#4a5f7c">只能拒绝或放弃判断</text><path d="M761.0 108h20" stroke="#315bad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="786.0" y="66" width="224.0" height="85" rx="9" fill="white" stroke="#c4d2e9"/><text x="800.0" y="97" font-family="sans-serif" font-size="18" font-weight="700" fill="#244d95">工具体</text><text x="800.0" y="126" font-family="sans-serif" font-size="14" fill="#4a5f7c">参数合法后才执行</text><rect x="30.0" y="186" width="308.0" height="85" rx="9" fill="white" stroke="#c4d2e9"/><text x="44.0" y="217" font-family="sans-serif" font-size="18" font-weight="700" fill="#244d95">执行结果</text><text x="44.0" y="246" font-family="sans-serif" font-size="14" fill="#4a5f7c">成功 / 失败 / 取消</text><path d="M341.0 228h20" stroke="#315bad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="366.0" y="186" width="308.0" height="85" rx="9" fill="white" stroke="#c4d2e9"/><text x="380.0" y="217" font-family="sans-serif" font-size="18" font-weight="700" fill="#244d95">有序结算</text><text x="380.0" y="246" font-family="sans-serif" font-size="14" fill="#4a5f7c">以 call id 关联</text><path d="M677.0 228h20" stroke="#315bad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="702.0" y="186" width="308.0" height="85" rx="9" fill="white" stroke="#c4d2e9"/><text x="716.0" y="217" font-family="sans-serif" font-size="18" font-weight="700" fill="#244d95">模型历史</text><text x="716.0" y="246" font-family="sans-serif" font-size="14" fill="#4a5f7c">记录结果后才能继续</text></svg>