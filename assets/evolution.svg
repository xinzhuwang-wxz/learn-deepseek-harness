<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 310" role="img" aria-labelledby="title"><title id="title">一个机制一层能力</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#315bad"/></marker></defs><rect width="1040" height="310" rx="16" fill="#f1f5fc"/><text x="30" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#142c54">一个机制一层能力</text><rect x="30.0" y="66" width="224.0" height="85" rx="9" fill="white" stroke="#c4d2e9"/><text x="44.0" y="97" font-family="sans-serif" font-size="18" font-weight="700" fill="#244d95">S01 循环</text><text x="44.0" y="126" font-family="sans-serif" font-size="14" fill="#4a5f7c">请求 → 工具 → 观察</text><path d="M257.0 108h20" stroke="#315bad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="282.0" y="66" width="224.0" height="85" rx="9" fill="white" stroke="#c4d2e9"/><text x="296.0" y="97" font-family="sans-serif" font-size="18" font-weight="700" fill="#244d95">S02 事件</text><text x="296.0" y="126" font-family="sans-serif" font-size="14" fill="#4a5f7c">事实 → 投影视图</text><path d="M509.0 108h20" stroke="#315bad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="534.0" y="66" width="224.0" height="85" rx="9" fill="white" stroke="#c4d2e9"/><text x="548.0" y="97" font-family="sans-serif" font-size="18" font-weight="700" fill="#244d95">S03 插件</text><text x="548.0" y="126" font-family="sans-serif" font-size="14" fill="#4a5f7c">注册 → 所有者 → 卸载</text><path d="M761.0 108h20" stroke="#315bad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="786.0" y="66" width="224.0" height="85" rx="9" fill="white" stroke="#c4d2e9"/><text x="800.0" y="97" font-family="sans-serif" font-size="18" font-weight="700" fill="#244d95">S04 守卫</text><text x="800.0" y="126" font-family="sans-serif" font-size="14" fill="#4a5f7c">决策 → 审批 → 执行</text><rect x="30.0" y="186" width="224.0" height="85" rx="9" fill="white" stroke="#c4d2e9"/><text x="44.0" y="217" font-family="sans-serif" font-size="18" font-weight="700" fill="#244d95">S05 结算</text><text x="44.0" y="246" font-family="sans-serif" font-size="14" fill="#4a5f7c">并发执行 · 有序记录</text><path d="M257.0 228h20" stroke="#315bad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="282.0" y="186" width="224.0" height="85" rx="9" fill="white" stroke="#c4d2e9"/><text x="296.0" y="217" font-family="sans-serif" font-size="18" font-weight="700" fill="#244d95">S06 压缩</text><text x="296.0" y="246" font-family="sans-serif" font-size="14" fill="#4a5f7c">替换可见面 · 保留事实</text><path d="M509.0 228h20" stroke="#315bad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="534.0" y="186" width="224.0" height="85" rx="9" fill="white" stroke="#c4d2e9"/><text x="548.0" y="217" font-family="sans-serif" font-size="18" font-weight="700" fill="#244d95">S07 技能</text><text x="548.0" y="246" font-family="sans-serif" font-size="14" fill="#4a5f7c">轻量目录 · 按需正文</text><path d="M761.0 228h20" stroke="#315bad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="786.0" y="186" width="224.0" height="85" rx="9" fill="white" stroke="#c4d2e9"/><text x="800.0" y="217" font-family="sans-serif" font-size="18" font-weight="700" fill="#244d95">S08 子会话</text><text x="800.0" y="246" font-family="sans-serif" font-size="14" fill="#4a5f7c">独立状态 · 委派预算</text></svg>