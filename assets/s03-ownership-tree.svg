<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">工具名相同，所有者不同</title><desc id="desc">root有double乘二，child_a有乘三覆盖，child_b回退root。查询向上不向兄弟；关闭a只删除a的注册。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3866a6" /></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#23776b" /></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d;font-size:19px} .title{font-size:28px;font-weight:700} .label{font-size:22px;font-weight:700} .small{font-size:17px} .mono{font-family:ui-monospace,monospace;font-size:18px} .edge{fill:none;stroke:#3866a6;stroke-width:2.5;marker-end:url(#arrow)} .muted{fill:#53657e}</style>
<rect width="1120" height="640" rx="16" fill="#f7f9fc" />
<text x="36" y="48" class="title" font-family="sans-serif" fill="#172b4d" font-size="28" font-weight="700">工具名相同，所有者不同</text>
<rect x="385" y="95" width="350" height="155" rx="12" fill="#eaf2ff" stroke="#bfd0e5" stroke-width="2" /><text x="405" y="129" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">root：double × 2</text><text x="405" y="162" font-family="sans-serif" fill="#172b4d" font-size="19">注册 token R</text><text x="405" y="191" font-family="sans-serif" fill="#172b4d" font-size="19">root 查询 → root 版本</text><rect x="60" y="340" width="425" height="195" rx="12" fill="#fff5e9" stroke="#dfbb83" stroke-width="2" /><text x="80" y="374" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">child_a：double × 3</text><text x="80" y="407" font-family="sans-serif" fill="#172b4d" font-size="19">parent → root；注册 token A</text><text x="80" y="436" font-family="sans-serif" fill="#172b4d" font-size="19">本层覆盖 → a 版本</text><text x="80" y="465" font-family="sans-serif" fill="#172b4d" font-size="19">close(a) 只撤销 token A</text><text x="80" y="494" font-family="sans-serif" fill="#172b4d" font-size="19">此后查询 a → 回退 root</text><rect x="635" y="340" width="425" height="195" rx="12" fill="#e8f5ef" stroke="#bfd0e5" stroke-width="2" /><text x="655" y="374" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">child_b：没有本地 double</text><text x="655" y="407" font-family="sans-serif" fill="#172b4d" font-size="19">parent → root</text><text x="655" y="436" font-family="sans-serif" fill="#172b4d" font-size="19">本层找不到 → root 版本</text><text x="655" y="465" font-family="sans-serif" fill="#172b4d" font-size="19">不会搜索兄弟 child_a</text><text x="655" y="494" font-family="sans-serif" fill="#172b4d" font-size="19">a 关闭前后均不受影响</text><path d="M270 340 V285 H440 V255" fill="none" stroke="#3866a6" stroke-width="2.5" /><polygon points="440.0,255.0 445.0,265.0 435.0,265.0" fill="#3866a6" /><path d="M850 340 V285 H680 V255" fill="none" stroke="#3866a6" stroke-width="2.5" /><polygon points="680.0,255.0 685.0,265.0 675.0,265.0" fill="#3866a6" /><text x="85" y="285" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">查询向父级走</text><text x="860" y="285" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">查询向父级走</text><text x="75" y="598" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">parent 是查找方向，不是安全沙箱，也不是“父关闭自动关闭所有子对象”的承诺。</text>
</svg>