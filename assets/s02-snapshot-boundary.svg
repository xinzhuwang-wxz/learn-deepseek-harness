<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc">
<title id="title">事实边界需要同时挡住写后修改和读后修改</title><desc id="desc">输入到Session和Session到读取者两条复制边界。共享内层列表的错误实现会被外部修改污染。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3866a6" /></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#23776b" /></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d;font-size:19px} .title{font-size:28px;font-weight:700} .label{font-size:22px;font-weight:700} .small{font-size:17px} .mono{font-family:ui-monospace,monospace;font-size:18px} .edge{fill:none;stroke:#3866a6;stroke-width:2.5;marker-end:url(#arrow)} .muted{fill:#53657e}</style>
<rect width="1120" height="590" rx="16" fill="#f7f9fc" />
<text x="36" y="48" class="title" font-family="sans-serif" fill="#172b4d" font-size="28" font-weight="700">事实边界需要同时挡住写后修改和读后修改</text>
<rect x="40" y="115" width="300" height="180" rx="12" fill="#fff" stroke="#bfd0e5" stroke-width="2" /><text x="60" y="149" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">调用方持有 data</text><text x="60" y="182" font-family="sans-serif" fill="#172b4d" font-size="19">items = [1]</text><text x="60" y="211" font-family="sans-serif" fill="#172b4d" font-size="19">append 后追加 2</text><text x="60" y="240" font-family="sans-serif" fill="#172b4d" font-size="19">调用方变成 [1, 2]</text><rect x="410" y="115" width="300" height="180" rx="12" fill="#eaf2ff" stroke="#bfd0e5" stroke-width="2" /><text x="430" y="149" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">Session 内部快照</text><text x="430" y="182" font-family="sans-serif" fill="#172b4d" font-size="19">seq = 0</text><text x="430" y="211" font-family="sans-serif" fill="#172b4d" font-size="19">items = [1]</text><text x="430" y="240" font-family="sans-serif" fill="#172b4d" font-size="19">后续外部编辑不能回写</text><rect x="780" y="115" width="300" height="180" rx="12" fill="#fff" stroke="#bfd0e5" stroke-width="2" /><text x="800" y="149" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">读取 events 副本</text><text x="800" y="182" font-family="sans-serif" fill="#172b4d" font-size="19">items = [1]</text><text x="800" y="211" font-family="sans-serif" fill="#172b4d" font-size="19">读取后追加 3</text><text x="800" y="240" font-family="sans-serif" fill="#172b4d" font-size="19">读出副本变成 [1, 3]</text><path d="M340 205 H405" fill="none" stroke="#3866a6" stroke-width="2.5" /><polygon points="405.0,205.0 395.0,210.0 395.0,200.0" fill="#3866a6" /><text x="355" y="180" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">写入</text><path d="M710 205 H775" fill="none" stroke="#3866a6" stroke-width="2.5" /><polygon points="775.0,205.0 765.0,210.0 765.0,200.0" fill="#3866a6" /><text x="727" y="180" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">读出</text><text x="346" y="330" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">两侧都是复制边界，不是共享同一个嵌套 list</text><rect x="40" y="390" width="1040" height="150" rx="12" fill="#fff5e9" stroke="#dfbb83" stroke-width="2" /><text x="60" y="424" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">错误对照：只复制最外层字典</text><text x="60" y="457" font-family="sans-serif" fill="#172b4d" font-size="19">浅复制仍共享 items 这个 list。外部 append(2) 会让“过去的事实”一起变成 [1, 2]。</text><text x="60" y="486" font-family="sans-serif" fill="#172b4d" font-size="19">JSON snapshot 拆开本例中的嵌套容器；它不提供磁盘保存、事务或完整事件协议校验。</text>
</svg>