<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
<title id="title">撤销的是某次注册，不是某个名字</title><desc id="desc">旧token和新token区别注册身份。旧disposer执行两次仍保留新工具；按名字删除则错误删除新工具。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3866a6" /></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#23776b" /></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d;font-size:19px} .title{font-size:28px;font-weight:700} .label{font-size:22px;font-weight:700} .small{font-size:17px} .mono{font-family:ui-monospace,monospace;font-size:18px} .edge{fill:none;stroke:#3866a6;stroke-width:2.5;marker-end:url(#arrow)} .muted{fill:#53657e}</style>
<rect width="1120" height="610" rx="16" fill="#f7f9fc" />
<text x="36" y="48" class="title" font-family="sans-serif" fill="#172b4d" font-size="28" font-weight="700">撤销的是某次注册，不是某个名字</text>
<rect x="40" y="105" width="305" height="200" rx="12" fill="#fff" stroke="#bfd0e5" stroke-width="2" /><text x="60" y="139" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">同一 scope 的两次注册</text><text x="60" y="172" font-family="sans-serif" fill="#172b4d" font-size="19">① token OLD → double v1</text><text x="60" y="201" font-family="sans-serif" fill="#172b4d" font-size="19">② token NEW → double v2</text><text x="60" y="230" font-family="sans-serif" fill="#172b4d" font-size="19">逆序查找：现在命中 v2</text><text x="60" y="259" font-family="sans-serif" fill="#172b4d" font-size="19">名字相同，注册身份不同</text><rect x="415" y="105" width="290" height="200" rx="12" fill="#eaf2ff" stroke="#bfd0e5" stroke-width="2" /><text x="435" y="139" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">旧 disposer 迟到</text><text x="435" y="172" font-family="sans-serif" fill="#172b4d" font-size="19">dispose_old()</text><text x="435" y="201" font-family="sans-serif" fill="#172b4d" font-size="19">只删除 token OLD</text><text x="435" y="230" font-family="sans-serif" fill="#172b4d" font-size="19">再次调用仍无影响</text><rect x="775" y="105" width="305" height="200" rx="12" fill="#e8f5ef" stroke="#bfd0e5" stroke-width="2" /><text x="795" y="139" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">剩余注册</text><text x="795" y="172" font-family="sans-serif" fill="#172b4d" font-size="19">token NEW → double v2</text><text x="795" y="201" font-family="sans-serif" fill="#172b4d" font-size="19">get("double") 仍为 v2</text><text x="795" y="230" font-family="sans-serif" fill="#172b4d" font-size="19">dispose_new() 才删除它</text><path d="M345 205 H410" fill="none" stroke="#3866a6" stroke-width="2.5" /><polygon points="410.0,205.0 400.0,210.0 400.0,200.0" fill="#3866a6" /><path d="M705 205 H770" fill="none" stroke="#3866a6" stroke-width="2.5" /><polygon points="770.0,205.0 760.0,210.0 760.0,200.0" fill="#3866a6" /><rect x="40" y="400" width="1040" height="155" rx="12" fill="#fff5e9" stroke="#dfbb83" stroke-width="2" /><text x="60" y="434" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">错误对照：del tools["double"]</text><text x="60" y="467" font-family="sans-serif" fill="#172b4d" font-size="19">如果只按名字删除，旧 disposer 会删除当前的 v2，而不是它当初创建的 v1。</text><text x="60" y="496" font-family="sans-serif" fill="#172b4d" font-size="19">本课允许同层同名注册以观察此问题；DeepSeek 工具服务对同层重复名称采用拒绝策略。</text>
</svg>