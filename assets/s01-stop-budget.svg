<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">停止规则与预算保护不是同一件事</title><desc id="desc">没有调用立即正常返回；有调用执行后需要下一轮预算，预算用完抛出异常。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3866a6" /></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#23776b" /></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d;font-size:19px} .title{font-size:28px;font-weight:700} .label{font-size:22px;font-weight:700} .small{font-size:17px} .mono{font-family:ui-monospace,monospace;font-size:18px} .edge{fill:none;stroke:#3866a6;stroke-width:2.5;marker-end:url(#arrow)} .muted{fill:#53657e}</style>
<rect width="1120" height="620" rx="16" fill="#f7f9fc" />
<text x="36" y="48" class="title" font-family="sans-serif" fill="#172b4d" font-size="28" font-weight="700">停止规则与预算保护不是同一件事</text>
<rect x="40" y="110" width="285" height="150" rx="12" fill="#fff" stroke="#bfd0e5" stroke-width="2" /><text x="60" y="144" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">收到 assistant 响应</text><text x="60" y="177" font-family="sans-serif" fill="#172b4d" font-size="19">先追加到 messages</text><text x="60" y="206" font-family="sans-serif" fill="#172b4d" font-size="19">calls 是否为空？</text><rect x="420" y="110" width="290" height="150" rx="12" fill="#e8f5ef" stroke="#bfd0e5" stroke-width="2" /><text x="440" y="144" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">calls 为空</text><text x="440" y="177" font-family="sans-serif" fill="#172b4d" font-size="19">立即返回历史</text><text x="440" y="206" font-family="sans-serif" fill="#172b4d" font-size="19">不消费下一条脚本响应</text><rect x="420" y="350" width="290" height="150" rx="12" fill="#fff" stroke="#bfd0e5" stroke-width="2" /><text x="440" y="384" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">calls 非空</text><text x="440" y="417" font-family="sans-serif" fill="#172b4d" font-size="19">逐个执行、逐个追加结果</text><text x="440" y="446" font-family="sans-serif" fill="#172b4d" font-size="19">然后尝试下一轮</text><rect x="795" y="350" width="285" height="150" rx="12" fill="#fff5e9" stroke="#dfbb83" stroke-width="2" /><text x="815" y="384" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">还有 step 预算？</text><text x="815" y="417" font-family="sans-serif" fill="#172b4d" font-size="19">有 → 再发模型请求</text><text x="815" y="446" font-family="sans-serif" fill="#172b4d" font-size="19">无 → 抛 RuntimeError</text><path d="M325 185 H415" fill="none" stroke="#3866a6" stroke-width="2.5" /><polygon points="415.0,185.0 405.0,190.0 405.0,180.0" fill="#3866a6" /><text x="340" y="168" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">是</text><path d="M180 260 V425 H415" fill="none" stroke="#3866a6" stroke-width="2.5" /><polygon points="415.0,425.0 405.0,430.0 405.0,420.0" fill="#3866a6" /><text x="190" y="310" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">否</text><path d="M710 425 H790" fill="none" stroke="#3866a6" stroke-width="2.5" /><polygon points="790.0,425.0 780.0,430.0 780.0,420.0" fill="#3866a6" /><text x="52" y="570" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">“没有工具调用”是本课的退出规则；“预算耗尽”是未完成的异常，不是另一种成功。</text>
</svg>