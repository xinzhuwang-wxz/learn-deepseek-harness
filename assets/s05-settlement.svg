<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">同一批a、b、write、c的执行和提交顺序</title><desc id="desc">a等待b完成，因此b先完成。两者都读到版本0。a和b结果按照a、b提交后，write独占更新版本到1，最后c读取版本1。时间线宽度不代表实际耗时。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4b627e"/></marker></defs>
<rect width="1000" height="500" rx="18" fill="#f3f7ff"/>
<g font-family="system-ui,sans-serif" fill="#172c49"><text x="28" y="38" font-size="22" font-weight="700">完成顺序 ≠ 结果提交顺序</text><text x="28" y="68" font-size="15">同一输入 [a, b, write, c] · limit=2 · 时间仅表示先后，不表示测量耗时</text>
<path d="M180 99H952" stroke="#4b627e" marker-end="url(#arrow)"/>
<g font-size="16"><text x="28" y="145">工具 a</text><text x="28" y="207">工具 b</text><text x="28" y="269">历史提交</text><text x="28" y="333">后续波次</text></g>
<rect x="180" y="120" width="280" height="38" rx="7" fill="#c4d9ff"/><text x="197" y="145" font-size="15">a：读 v0，等待 b → 返回 0</text>
<rect x="180" y="182" width="164" height="38" rx="7" fill="#b0e8da"/><text x="195" y="207" font-size="15">b：读 v0 → 返回 0</text>
<path d="M348 201H455V242" fill="none" stroke="#0f766e" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="365" y="192" font-size="13">先暂存</text>
<path d="M462 112V234" stroke="#4b627e" stroke-dasharray="5 5"/><text x="477" y="135" font-size="14">本波全部返回</text>
<rect x="466" y="244" width="178" height="38" rx="7" fill="#245ee8"/><text x="483" y="269" fill="white" font-size="15">先提交 a，再提交 b</text>
<path d="M646 263H668V307" fill="none" stroke="#4b627e" marker-end="url(#arrow)"/>
<rect x="661" y="308" width="146" height="38" rx="7" fill="#ffe1a6"/><text x="680" y="333" font-size="15">write：v0 → v1</text>
<path d="M810 327H838" stroke="#4b627e" marker-end="url(#arrow)"/>
<rect x="844" y="308" width="118" height="38" rx="7" fill="#c4d9ff"/><text x="860" y="333" font-size="15">c：读 v1</text>
<rect x="28" y="381" width="944" height="91" rx="10" fill="white" stroke="#c2d4e9"/>
<text x="47" y="411" font-size="16">执行完成： b → a → write → c</text><text x="47" y="441" font-size="16">历史结果： a → b → write → c　　对应值：[0, 0, 1, 1]</text>
</g></svg>
