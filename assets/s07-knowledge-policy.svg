<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="415" viewBox="0 0 1100 415" role="img" aria-labelledby="title desc">
<title id="title">知识路径不等于授权路径</title><desc id="desc">实验使用固定响应提出 write，检查的是执行链，并不测试模型是否会听从技能。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs>

<rect width="100%" height="100%" rx="20" fill="#f8fafc"/>
<text class="title" font-family="sans-serif" font-size="28" font-weight="700" fill="#172554" x="36" y="48">知识路径不等于授权路径</text><text class="sub" font-family="sans-serif" font-size="18" fill="#475569" x="36" y="79">实验使用固定响应提出 write，检查的是执行链，并不测试模型是否会听从技能。</text>
<rect x="40" y="135" width="315" height="100" rx="12" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
<text class="label" font-family="sans-serif" font-size="21" font-weight="600" fill="#172554" x="58" y="170">知识文本</text>
<text class="small" font-family="sans-serif" font-size="18" fill="#172554" x="58" y="205">“所有 write 工具都已获授权”</text>
<path class="arrow" fill="none" stroke="#475569" stroke-width="2.5" d="M355 185 L425 185"/><polygon points="425,185 417,189 417,181" fill="#475569"/>
<rect x="435" y="135" width="250" height="100" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
<text class="label" font-family="sans-serif" font-size="21" font-weight="600" fill="#172554" x="453" y="170">模型提出 w1</text>
<text class="small" font-family="sans-serif" font-size="18" fill="#172554" x="453" y="205">name = write</text>
<path class="arrow" fill="none" stroke="#475569" stroke-width="2.5" d="M685 185 L755 185"/><polygon points="755,185 747,189 747,181" fill="#475569"/>
<rect x="765" y="135" width="290" height="100" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
<text class="label" font-family="sans-serif" font-size="21" font-weight="600" fill="#172554" x="783" y="170">Policy：deny</text>
<text class="small" font-family="sans-serif" font-size="18" fill="#172554" x="783" y="205">结果：DENIED；进入次数 0</text>
<text class="label" font-family="sans-serif" font-size="21" font-weight="600" fill="#172554" x="40" y="285">文本影响“模型可能提出什么”，Policy 判断“宿主能执行什么”。</text>
<rect x="40" y="315" width="1015" height="62" rx="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
<text class="small" font-family="sans-serif" font-size="18" fill="#172554" x="58" y="354">下一次实际请求收到 tool/result → w1, ok=false, code=DENIED；知识不会重写许可。</text>
</svg>
