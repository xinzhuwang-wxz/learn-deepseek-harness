<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">组合实验的状态边界</title><desc id="desc">循环写入九条事实；压缩追加第十条但只保留两条可见消息；fork复制前缀后子级独立追加；关闭scope撤销注册而不删除事实。</desc><rect width="1100" height="560" rx="20" fill="#f8fafc"/>
<text x="35" y="48" font-family="sans-serif" font-size="28" fill="#172554">一个42，四处可检查的状态</text>
<rect x="35" y="95" width="310" height="145" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="53" y="129" font-family="sans-serif" font-size="20" fill="#172554">1. 模型 → 工具 → 下一请求</text>
<text x="53" y="162" font-family="sans-serif" font-size="20" fill="#172554">scope拥有double注册</text>
<text x="53" y="195" font-family="sans-serif" font-size="20" fill="#172554">requests[1]收到c1 → 42</text>
<rect x="395" y="95" width="310" height="145" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="413" y="129" font-family="sans-serif" font-size="20" fill="#172554">2. Session：9条事实</text>
<text x="413" y="162" font-family="sans-serif" font-size="20" fill="#172554">visible：4条消息</text>
<text x="413" y="195" font-family="sans-serif" font-size="20" fill="#172554">compact_prefix(3, 摘要)</text>
<rect x="755" y="95" width="310" height="145" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="773" y="129" font-family="sans-serif" font-size="20" fill="#172554">3. 追加surface/replace</text>
<text x="773" y="162" font-family="sans-serif" font-size="20" fill="#172554">原日志：10条事实</text>
<text x="773" y="195" font-family="sans-serif" font-size="20" fill="#172554">visible：摘要 + 最终文本</text>
<path d="M345 165 L390 165" fill="none" stroke="#475569" stroke-width="3"/><path d="M382 160 L390 165 L382 170" fill="none" stroke="#475569" stroke-width="3"/>
<path d="M705 165 L750 165" fill="none" stroke="#475569" stroke-width="3"/><path d="M742 160 L750 165 L742 170" fill="none" stroke="#475569" stroke-width="3"/>
<rect x="395" y="330" width="310" height="145" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="413" y="364" font-family="sans-serif" font-size="20" fill="#172554">5. 子级追加自己的消息</text>
<text x="413" y="397" font-family="sans-serif" font-size="20" fill="#172554">child.events：11条</text>
<text x="413" y="430" font-family="sans-serif" font-size="20" fill="#172554">parent.events仍是10条</text>
<rect x="755" y="330" width="310" height="145" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="773" y="364" font-family="sans-serif" font-size="20" fill="#172554">4. fork(boundary=9)</text>
<text x="773" y="397" font-family="sans-serif" font-size="20" fill="#172554">复制完整事实前缀</text>
<text x="773" y="430" font-family="sans-serif" font-size="20" fill="#172554">child.depth = 1</text>
<path d="M910 240 V325 M905 317 L910 325 L915 317 M755 400 H710 M718 395 L710 400 L718 405" fill="none" stroke="#475569" stroke-width="3"/>
<rect x="35" y="330" width="310" height="145" rx="12" fill="#fee2e2" stroke="#94a3b8"/>
<text x="53" y="364" font-family="sans-serif" font-size="20" fill="#172554">6. scope.close()</text>
<text x="53" y="397" font-family="sans-serif" font-size="20" fill="#172554">double注册被撤销</text>
<text x="53" y="430" font-family="sans-serif" font-size="20" fill="#172554">历史事实仍然保留</text>
<path d="M395 400 H350 M358 395 L350 400 L358 405" fill="none" stroke="#475569" stroke-width="3"/>
<text x="35" y="525" font-family="sans-serif" font-size="20" fill="#172554">可见位置3 ≠ 日志下标9；单调用成功 ≠ 并发、拒绝与技能路径已覆盖</text>
</svg>