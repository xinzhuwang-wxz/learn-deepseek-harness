<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 685" role="img" aria-labelledby="title desc">
<title id="title">9 条事件，4 条模型消息，2 条审计记录</title><desc id="desc">序号0到8的原始事件投影到模型与审计两个视图；工具结果seq4可同时出现在两种投影中。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3866a6" /></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#23776b" /></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d;font-size:19px} .title{font-size:28px;font-weight:700} .label{font-size:22px;font-weight:700} .small{font-size:17px} .mono{font-family:ui-monospace,monospace;font-size:18px} .edge{fill:none;stroke:#3866a6;stroke-width:2.5;marker-end:url(#arrow)} .muted{fill:#53657e}</style>
<rect width="1120" height="685" rx="16" fill="#f7f9fc" />
<text x="36" y="48" class="title" font-family="sans-serif" fill="#172b4d" font-size="28" font-weight="700">9 条事件，4 条模型消息，2 条审计记录</text>
<rect x="38" y="94" width="435" height="510" rx="12" fill="#fff" stroke="#bfd0e5" stroke-width="2" /><text x="58" y="128" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">一份事实日志：seq 不变</text><rect x="52" y="144" width="405" height="38" rx="6" fill="#eaf2ff" /><text x="66" y="167" class="mono" font-family="sans-serif" fill="#172b4d" font-size="18">0</text><text x="105" y="167" class="mono" font-family="sans-serif" fill="#172b4d" font-size="18">user/message</text><text x="326" y="167" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">用户问题</text><text x="66" y="214" class="mono" font-family="sans-serif" fill="#172b4d" font-size="18">1</text><text x="105" y="214" class="mono" font-family="sans-serif" fill="#172b4d" font-size="18">step/start</text><text x="326" y="214" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">step 0</text><rect x="52" y="238" width="405" height="38" rx="6" fill="#eaf2ff" /><text x="66" y="261" class="mono" font-family="sans-serif" fill="#172b4d" font-size="18">2</text><text x="105" y="261" class="mono" font-family="sans-serif" fill="#172b4d" font-size="18">assistant/message</text><text x="326" y="261" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">calls[c1]</text><text x="66" y="308" class="mono" font-family="sans-serif" fill="#172b4d" font-size="18">3</text><text x="105" y="308" class="mono" font-family="sans-serif" fill="#172b4d" font-size="18">tool/call</text><text x="326" y="308" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">处理 c1</text><rect x="52" y="332" width="405" height="38" rx="6" fill="#eaf2ff" /><text x="66" y="355" class="mono" font-family="sans-serif" fill="#172b4d" font-size="18">4</text><text x="105" y="355" class="mono" font-family="sans-serif" fill="#172b4d" font-size="18">tool/result</text><text x="326" y="355" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">c1 → 42</text><text x="66" y="402" class="mono" font-family="sans-serif" fill="#172b4d" font-size="18">5</text><text x="105" y="402" class="mono" font-family="sans-serif" fill="#172b4d" font-size="18">step/end</text><text x="326" y="402" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">step 0</text><text x="66" y="449" class="mono" font-family="sans-serif" fill="#172b4d" font-size="18">6</text><text x="105" y="449" class="mono" font-family="sans-serif" fill="#172b4d" font-size="18">step/start</text><text x="326" y="449" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">step 1</text><rect x="52" y="473" width="405" height="38" rx="6" fill="#eaf2ff" /><text x="66" y="496" class="mono" font-family="sans-serif" fill="#172b4d" font-size="18">7</text><text x="105" y="496" class="mono" font-family="sans-serif" fill="#172b4d" font-size="18">assistant/message</text><text x="326" y="496" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">text 42</text><text x="66" y="543" class="mono" font-family="sans-serif" fill="#172b4d" font-size="18">8</text><text x="105" y="543" class="mono" font-family="sans-serif" fill="#172b4d" font-size="18">step/end</text><text x="326" y="543" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">step 1</text><rect x="625" y="94" width="455" height="255" rx="12" fill="#eaf2ff" stroke="#bfd0e5" stroke-width="2" /><text x="645" y="128" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">模型消息投影</text><text x="645" y="161" font-family="sans-serif" fill="#172b4d" font-size="19">seq 0 → user</text><text x="645" y="190" font-family="sans-serif" fill="#172b4d" font-size="19">seq 2 → assistant + calls[c1]</text><text x="645" y="219" font-family="sans-serif" fill="#172b4d" font-size="19">seq 4 → tool + call_id=c1 + value=42</text><text x="645" y="248" font-family="sans-serif" fill="#172b4d" font-size="19">seq 7 → assistant + text=42</text><text x="645" y="277" font-family="sans-serif" fill="#172b4d" font-size="19">输出不保留 seq/type 外壳</text><rect x="625" y="400" width="455" height="204" rx="12" fill="#e8f5ef" stroke="#bfd0e5" stroke-width="2" /><text x="645" y="434" class="label" font-family="sans-serif" fill="#172b4d" font-size="22" font-weight="700">审计投影（走读中的过滤器）</text><text x="645" y="467" font-family="sans-serif" fill="#172b4d" font-size="19">seq 3 → tool/call: c1</text><text x="645" y="496" font-family="sans-serif" fill="#172b4d" font-size="19">seq 4 → tool/result: c1, 42</text><text x="645" y="525" font-family="sans-serif" fill="#172b4d" font-size="19">保留 seq，便于回到同一条事实</text><text x="645" y="554" font-family="sans-serif" fill="#172b4d" font-size="19">不再另外维护一份可变历史</text><path d="M473 220 H620" fill="none" stroke="#3866a6" stroke-width="2.5" /><polygon points="620.0,220.0 610.0,225.0 610.0,215.0" fill="#3866a6" /><text x="490" y="204" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">surface</text><path d="M473 477 H620" fill="none" stroke="#23776b" stroke-width="2.5" marker-end="url(#green)" /><polygon points="620,477 610,472 610,482" fill="#23776b" /><text x="484" y="461" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">filter</text><text x="40" y="645" class="small" font-family="sans-serif" fill="#172b4d" font-size="17">蓝色事件进入模型视图；同一 seq 4 同时被两个消费者使用，不表示发生了两次工具执行。</text>
</svg>