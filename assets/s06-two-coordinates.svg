<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="615" viewBox="0 0 1100 615" role="img" aria-labelledby="title desc">
<title id="title">位置决定选谁，seq 说明它是谁</title><desc id="desc">替换后 seq 可以非单调；原日志不变，投影次序变化。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs>

<rect width="100%" height="100%" rx="20" fill="#f8fafc"/>
<text class="title" font-family="sans-serif" font-size="28" font-weight="700" fill="#172554" x="36" y="48">位置决定选谁，seq 说明它是谁</text><text class="sub" font-family="sans-serif" font-size="18" fill="#475569" x="36" y="79">替换后 seq 可以非单调；原日志不变，投影次序变化。</text>
<text class="label" font-family="sans-serif" font-size="21" font-weight="600" fill="#172554" x="40" y="125">原始日志坐标：追加顺序始终是 0,1,2,…</text>
<rect x="40" y="145" width="1010" height="74" rx="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
<text class="mono" font-family="monospace" font-size="18" fill="#172554" x="58" y="175">0 user   1 start   2 call   3 attempt   4 result   5 end   6 start   7 final   8 end</text>
<text class="small" font-family="sans-serif" font-size="18" fill="#172554" x="58" y="204">第一次追加 seq9: replace [0,2,4]；随后追加 seq10: 新问题；第二次追加 seq11: replace [9,7]</text>
<text class="label" font-family="sans-serif" font-size="21" font-weight="600" fill="#172554" x="40" y="260">当前可见面坐标：按当前位置选择，不按 seq 数值排序</text>
<text class="small" font-family="sans-serif" font-size="18" fill="#172554" x="40" y="321">第一次压缩后</text>
<rect x="270" y="285" width="225" height="64" rx="12" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
<text class="mono" font-family="monospace" font-size="18" fill="#172554" x="282" y="311">position 0 → seq9</text>
<text class="small" font-family="sans-serif" font-size="18" fill="#172554" x="282" y="337">摘要</text>
<rect x="520" y="285" width="225" height="64" rx="12" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
<text class="mono" font-family="monospace" font-size="18" fill="#172554" x="532" y="311">position 1 → seq7</text>
<text class="small" font-family="sans-serif" font-size="18" fill="#172554" x="532" y="337">最终回答</text>
<path class="arrow" fill="none" stroke="#475569" stroke-width="2.5" d="M925 351 L925 373"/><polygon points="925,373 921,365 929,365" fill="#475569"/>
<text class="small" font-family="sans-serif" font-size="18" fill="#172554" x="40" y="416">加新问题后</text>
<rect x="270" y="380" width="225" height="64" rx="12" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
<text class="mono" font-family="monospace" font-size="18" fill="#172554" x="282" y="406">position 0 → seq9</text>
<text class="small" font-family="sans-serif" font-size="18" fill="#172554" x="282" y="432">摘要</text>
<rect x="520" y="380" width="225" height="64" rx="12" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
<text class="mono" font-family="monospace" font-size="18" fill="#172554" x="532" y="406">position 1 → seq7</text>
<text class="small" font-family="sans-serif" font-size="18" fill="#172554" x="532" y="432">最终回答</text>
<rect x="770" y="380" width="225" height="64" rx="12" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
<text class="mono" font-family="monospace" font-size="18" fill="#172554" x="782" y="406">position 2 → seq10</text>
<text class="small" font-family="sans-serif" font-size="18" fill="#172554" x="782" y="432">新问题</text>
<path class="arrow" fill="none" stroke="#475569" stroke-width="2.5" d="M925 446 L925 468"/><polygon points="925,468 921,460 929,460" fill="#475569"/>
<text class="small" font-family="sans-serif" font-size="18" fill="#172554" x="40" y="511">再次压缩前两项后</text>
<rect x="270" y="475" width="225" height="64" rx="12" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
<text class="mono" font-family="monospace" font-size="18" fill="#172554" x="282" y="501">position 0 → seq11</text>
<text class="small" font-family="sans-serif" font-size="18" fill="#172554" x="282" y="527">新摘要</text>
<rect x="520" y="475" width="225" height="64" rx="12" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
<text class="mono" font-family="monospace" font-size="18" fill="#172554" x="532" y="501">position 1 → seq10</text>
<text class="small" font-family="sans-serif" font-size="18" fill="#172554" x="532" y="527">新问题</text>
<text class="small" font-family="sans-serif" font-size="18" fill="#172554" x="40" y="580">第二次 count=2 选中 [9,7]，不是原始日志前两条 [0,1]，也不是 seq≤2。</text>
</svg>
